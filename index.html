<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Money Audio Visualizer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/overlay.css">
    <link rel="stylesheet" href="css/hud.css">

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="start-overlay">
        <div class="start-card">
            <h1>E-Money Audio Visualizer</h1>
            <div class="btn-group">
                <button id="start-system-btn">System Audio</button>
                <button id="start-mic-btn">Microphone</button>
            </div>
            <p class="overlay-hint">For system audio, tick &ldquo;Share audio&rdquo; in the share dialog</p>
        </div>
    </div>

    <!-- The whole interface: one floating bar. -->
    <div id="hud" class="ui-layer glass" role="toolbar" aria-label="Visualizer controls">

        <div class="hud-cell">
            <!-- Filled in by ControlPanel from the registry in visuals/modes.js. -->
            <div class="seg" id="mode-list" role="radiogroup" aria-label="Visualizer"></div>
        </div>

        <div class="hud-cell">
            <div class="seg" role="group" aria-label="Audio source">
                <button id="btn-src-system" class="seg-btn" aria-pressed="false">System</button>
                <button id="btn-src-mic" class="seg-btn" aria-pressed="false">Mic</button>
            </div>
        </div>

        <div class="hud-cell">
            <span class="hud-label">Tempo</span>
            <span class="hud-value" id="val-bpm">&mdash;</span>
        </div>

        <div class="hud-cell">
            <label class="hud-label" for="inp-sensitivity">Sens</label>
            <input type="range" id="inp-sensitivity" min="0.10" max="2.20" step="0.01" value="1.00" hidden>
            <span class="hud-value hud-value-short" id="val-sensitivity">1.00</span>
            <div class="seg">
                <button id="btn-auto-sensitivity" class="seg-btn" aria-pressed="true"
                        title="Toggle automatic sensitivity (A)">Auto</button>
            </div>
        </div>

        <div class="hud-cell">
            <button id="fullscreen-btn" class="icon-btn" title="Fullscreen (F)" aria-label="Fullscreen">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
            </button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
